services:
  schulos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schulos
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/db/schulos.db}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_PATH: ${STORAGE_PATH:-/data/uploads}
      EXPORT_PATH: ${EXPORT_PATH:-/data/exports}
      BACKUP_PATH: ${BACKUP_PATH:-/data/backups}
    ports:
      - "${SCHULOS_PORT:-3000}:3000"
    volumes:
      - schulos-data:/data

volumes:
  schulos-data:
